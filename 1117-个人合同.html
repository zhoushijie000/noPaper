<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>选择签署方式 · 无纸化办公</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f3f4f6; color: #333; font: 16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif }
button,input { font: inherit }
button { cursor: pointer; border: 0; background: none; color: inherit }
:focus-visible { outline: 2px solid #087fec; outline-offset: 2px }
[hidden] { display: none !important }
main { width: min(100%,480px); margin: auto; min-height: 100vh; min-height: 100dvh; background: white }
h1,h2,p { margin: 0 }
.org { height: 36px; text-align: center; font-size: 16px; line-height: 36px; color: #111 }
#entry { min-height: 100dvh; background: white }
.org { background: white }
.entry-banner { position: relative; overflow: hidden; background: #0981ed }
.banner { display: block; width: 100%; height: auto }
.entry-banner h2 { position: absolute; left: 0; top: 0; display: flex; align-items: center; margin: 0; padding-left: 5%; width: 49%; height: 77%; background: #387de4; color: white; font-size: 25px; font-weight: 400 }
.entry-options { position: relative; display: grid; gap: 22px; padding: 30px 9.3% 50px; background: white; border-radius: 20px 20px 0 0 }
.entry-option { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; min-height: 56px; padding: 14px 8px; background: #0981ed; border-radius: 7px; color: white; text-align: center; font-size: 18px; font-weight: 400 }
.entry-option:hover { background: #0875d7 }
.entry-option:active { background: #076bc5 }
.entry-description { font-size: 15px }
.list-header { display: flex; align-items: center; justify-content: center; position: relative; height: 46px; background: white; border-bottom: 1px solid #f5f5f5 }
.list-header h1 { font-size: 16px; font-weight: 500 }
.back { position: absolute; left: 12px; height: 40px; color: #0784df; font-size: 14px }
input[type=checkbox] { width: 21px; height: 21px; margin: 0; accent-color: #097feb }
.primary { display: block; background: #0981ed; border-radius: 7px; color: white; padding: 11px 16px; font-weight: 500 }
#list { min-height: 100vh; background: #f4f5f7 }
nav { display: flex; position: sticky; top: 0; z-index: 1; background: white }
nav button { position: relative; flex: 1; height: 46px; padding: 0; color: #999 }
nav button[aria-pressed=true] { color: #333 }
nav button[aria-pressed=true]::after { content: ''; position: absolute; bottom: 0; left: calc(50% - 12px); width: 24px; height: 3px; background: #008df3; border-radius: 4px }
#all { position: relative }
#all::after { content: ''; position: absolute; right: -8px; top: -1px; width: 6px; height: 6px; border-radius: 50%; background: #008df3 }
#cards { display: grid; gap: 14px; padding: 14px 3.8% 68px }
article { background: white; border-radius: 8px; padding: 15px 4.3% 0 }
.row { display: flex; align-items: center; justify-content: space-between; gap: 6px }
.meta,.by { font-size: 14px; color: #999 }
.number { overflow-wrap: anywhere }
.badge { flex: none; color: white; background: #ffbd00; border-radius: 3px; padding: 1px 4px; font-size: 12px }
h2 { margin: 8px 0; font-size: 16px }
.by span { margin-left: 10px; color: #333 }
.people { margin-top: 9px }
.person { min-height: 34px; color: #101010 }
.party { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72% }
.tag { border: 1px solid #efdc8f; background: #fffbeb; color: #dba522; border-radius: 2px; font-size: 12px; padding: 0 2px }
.done { background: #e8f6f0; border-color: #b4ddca; color: #28845e }
.action { width: 100%; height: 51px; border-top: 1px solid #eee; color: #008cda; font-weight: 600 }
.batch { position: fixed; right: max(calc((100vw - 480px)/2 + 16px),16px); bottom: 16%; background: white; border-radius: 50%; width: 52px; height: 52px; font-size: 10px; box-shadow: 0 2px 7px #0002 }
.batch svg { width: 17px; display: block; margin: 0 auto 2px; stroke: #008adc; fill: none; stroke-width: 2 }
dialog { width: min(88vw,370px); max-height: 80dvh; padding: 22px; border: none; border-radius: 12px; color: #333 }
dialog::backdrop { background: #0006 }
dialog h2 { margin-top: 0 }
dialog p { color: #666; font-size: 14px; margin: 10px 0 }
dialog footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px }
.choice { display: flex; gap: 8px; align-items: center; padding: 8px 0; font-size: 13px }
#choices { max-height: 40dvh; overflow: auto }
</style>
</head>

<div class="entry-options">
<button class="entry-option" data-mode="signature">
<span>签字</span><span class="entry-description">（承包方、发包方）</span>
</button>
<button class="entry-option" data-mode="seal">
<span>签章</span><span class="entry-description">（发包方负责人）</span>
</button>
</div>
</section>
<section id="list" aria-label="我的合同" hidden>
<header class="list-header"><button class="back" id="back">‹ 返回</button><h1 id="listTitle">我的合同</h1></header>
<nav aria-label="合同状态"><button data-filter="全部" aria-pressed="true"><span id="all"></span></button><button data-filter="待签署" aria-pressed="false">待签署</button><button data-filter="已签署" aria-pressed="false">已签署</button></nav>
<div id="cards"></div>
<button class="batch" id="batch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-3M9 16l1-4 8-8 3 3-8 8-4 1Z"/></svg>批量签署</button>
</section>
</main>
<dialog id="panel" aria-labelledby="heading"><h2 id="heading"></h2><p id="message"></p><div id="choices"></div><footer><button id="closeDialog">关闭</button><button class="primary" id="approve" hidden>模拟签署</button></footer></dialog>
<script>
const el = id => document.getElementById(id);
const firstNumbers = ['2122208670441861121','2122205383076409346','2122205181129060354'];
const pending = '待签署', signed = '已签署';
const owner = '周世杰';
const modes = { signature: '签字', seal: '签章' };
const contractLists = {};
let mode = '', contracts = [], filter = '全部', selected = new Set();
function node(tag, css, value) {
  const item = document.createElement(tag);
  item.className = css;
  item.textContent = value;
  return item;
}
function party(name, status) {
  const row = node('div','row person','');
  row.append(node('span','party',name), node('span','tag' + (status === signed ? ' done' : ''),status === signed ? '已' + modes[mode] : '待' + modes[mode]));
  return row;
}
function card(contract) {
  const box = document.createElement('article');
  const meta = node('div','row meta','');
  meta.append(node('span','number','电子合同号: ' + contract.number),node('span','badge' + (contract.status === signed ? ' done' : ''), contract.status));
  const by = node('p','by','发起方');
  by.append(node('span','',owner));
  const people = node('div','people','');
  people.append(party(owner,contract.status),party('系统测试0712_四川CA测试签署方',contract.partner));
  const action = node('button','action',contract.status === pending ? '签约' : '查看');
  action.onclick = () => {
    showPanel('存量房测试合同','电子合同号 ' + contract.number + '。' + modes[mode] + '人 ' + owner + '（' + contract.status + '）。此为演示合同。');
    if (contract.status === pending) {
      selected.add(contract.number);
      el('approve').hidden = false;
    }
  };
  box.append(meta,node('h2','','存量房测试合同'),by,people,action);
  return box;
}
function render() {
  el('all').textContent = '全部 (' + contracts.length + ')';
  document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.filter === filter)));
  const visible = contracts.filter(c => filter === '全部' || filter === c.status);
  el('cards').replaceChildren(...visible.map(card));
  if (!visible.length) el('cards').append(node('p','meta','暂无' + filter + '合同'));
  el('batch').hidden = filter === signed || !contracts.some(c => c.status === pending);
}
function createContracts() {
  return Array.from({length:123},(_,i) => ({
    number: firstNumbers[i] || '212220518112906' + String(3500+i),
    status: i % 5 === 4 ? signed : pending,
    partner: i % 5 === 4 ? signed : pending
  }));
}
function navigate() {
  mode = location.hash.slice(1);
  const open = Object.hasOwn(modes, mode);
  el('panel').close();
  selected.clear();
  el('entry').hidden = open;
  el('list').hidden = !open;
  document.title = (open ? modes[mode] + '合同' : '选择签署方式') + ' · 无纸化办公';
  if (open) {
    contractLists[mode] ??= createContracts();
    contracts = contractLists[mode];
    filter = '全部';
    el('listTitle').textContent = modes[mode] + '合同';
    el('approve').textContent = '模拟' + modes[mode];
    render();
  }
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-mode]').forEach(button => {
  button.onclick = () => { location.hash = button.dataset.mode; };
});
el('back').onclick = () => { location.hash = ''; };
window.addEventListener('hashchange',navigate);
document.querySelector('nav').onclick = e => {
  const tab = e.target.closest('[data-filter]');
  if (tab) { filter = tab.dataset.filter; render(); window.scrollTo(0,0); }
};
function showPanel(title, message) {
  selected.clear();
  el('choices').replaceChildren();
  el('heading').textContent = title;
  el('message').textContent = message;
  el('approve').hidden = true;
  el('approve').disabled = false;
  el('panel').showModal();
}
el('closeDialog').onclick = () => el('panel').close();
el('batch').onclick = () => {
  showPanel('批量' + modes[mode],'请选择需要模拟' + modes[mode] + '的合同。');
  el('approve').hidden = false;
  el('approve').disabled = true;
  for (const c of contracts.filter(c => c.status === pending)) {
    const label = node('label','choice','');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.onchange = () => {
      if (check.checked) selected.add(c.number);
      else selected.delete(c.number);
      el('approve').disabled = !selected.size;
    };
    label.append(check, c.number);
    el('choices').append(label);
  }
};
el('approve').onclick = () => {
  for (const c of contracts) if (selected.has(c.number)) c.status = signed;
  el('panel').close();
  render();
};
navigate();
</script>
