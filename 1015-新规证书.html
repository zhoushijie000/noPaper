<script>
const data=[{entityid:'ENT202609300001',valid:'2026-09-30 17:19:14 ~ 2027-09-30 17:21:25',seals:[{type:'电子名章',text:['法人','印章'],valid:'2026-09-30 17:19:14 ~ 2027-09-30 17:21:25'},{type:'电子法定名称章',text:['财务','印章'],valid:'2026-09-30 14:22:08 ~ 2027-09-30 14:23:06'}]},{entityid:'ENT202609300001',valid:'2026-10-01 09:00:00 ~ 2027-10-01 09:00:00',seals:[{type:'电子合同专用章',text:['合同','印章'],valid:'2026-10-01 09:00:00 ~ 2027-10-01 09:00:00'}]}];let current=0,lastPinButton=null,timer;

function stamp(lines){return `<svg class="stamp" viewBox="0 0 160 160" role="img" aria-label="${lines.join('')}示例图片"><circle cx="80" cy="80" r="73" fill="none" stroke="currentColor" stroke-width="6"/><text x="80" y="69" fill="currentColor" font-family="KaiTi,STKaiti,serif" font-size="46" text-anchor="middle" letter-spacing="5">${lines[0]}</text><text x="80" y="119" fill="currentColor" font-family="KaiTi,STKaiti,serif" font-size="46" text-anchor="middle" letter-spacing="5">${lines[1]}</text></svg>`}
function render(sealsOnly=false){$('certificates').innerHTML=data.map((c,i)=>`<article class="certificate">${sealsOnly?'':`<div class="cert-head"><div class="cert-title"><svg class="icon"><use href="#doc"/></svg>证书 ${String(i+1).padStart(2,'0')}<span class="state">${c.set?'PIN 码已设置（演示）':''}</span><button class="link" data-pin="${i}" onclick="openPin(${i},this)">设置 PIN 码</button></div><div class="cert-data"><div><label>企业 entityid</label><span>${c.entityid}</span></div><div><label>证书有效期</label><span>${c.valid}</span></div></div></div>`}${c.seals.map(s=>`<div class="seal"><div class="seal-image">${stamp(s.text)}</div><div class="seal-info"><div class="seal-type">印章类型：${s.type}</div><div class="seal-validity"><label>印章有效期</label>${s.valid}</div></div></div>`).join('')}</article>`).join('')}
function openCertificates(sealsOnly=false){render(sealsOnly);$('cert-heading').textContent=sealsOnly?'查看企业印章详情':'新规证书';$('summary').textContent=sealsOnly?'共 3 枚印章 · 示例数据':'共 2 张证书 · 示例数据';$('cert-layer').hidden=false;document.body.style.overflow='hidden';$('cert-layer').querySelector('.close').focus()}
function closeCertificates(){$('cert-layer').hidden=true;document.body.style.overflow='';$('cert-entry').focus()}
function openPin(i,button){current=i;lastPinButton=button;$('pin-form').reset();$('pin-error').textContent='';$('pin-context').textContent=`证书 ${String(i+1).padStart(2,'0')} · 企业 entityid：${data[i].entityid}`;$('pin-layer').hidden=false;$('pin').focus()}
function closePin(){$('pin-layer').hidden=true;$('pin-form').reset();document.querySelector(`[data-pin="${current}"]`)?.focus()}
$('pin-form').addEventListener('submit',e=>{e.preventDefault();if(!$('pin').value.trim()){$('pin-error').textContent='请输入 PIN 码';return}if($('pin').value!==$('confirm-pin').value){$('pin-error').textContent='两次输入的 PIN 码不一致，请重新输入';$('confirm-pin').focus();return}data[current].set=true;render();closePin();toast(`证书 ${String(current+1).padStart(2,'0')} PIN 码设置成功（演示）`)});
function toast(message){clearTimeout(timer);$('toast').textContent=message;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,3000)}
function search(){let match='锐途科技有限公司'.includes($('company').value.trim())&&'91221382MACNH08019'.includes($('credit').value.trim())&&'苟冬'.includes($('person').value.trim());$('company-row').hidden=!match;$('empty').hidden=match;$('count').textContent=match?'共 1 条':'共 0 条'}function resetSearch(){['company','credit','person','access'].forEach(id=>$(id).value='');search()}
function openFetch(){$('fetch-form').reset();$('fetch-error').textContent='';$('fetch-layer').hidden=false;document.body.style.overflow='hidden';$('fetch-company').focus()}
function closeFetch(){$('fetch-layer').hidden=true;document.body.style.overflow='';$('fetch-entry').focus()}
$('fetch-form').addEventListener('submit',e=>{e.preventDefault();if(!$('fetch-company').value.trim()){$('fetch-error').textContent='请输入企业名称';$('fetch-company').focus();return}closeFetch();toast('获取流程演示完成，尚未连接真实印章接口')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('fetch-layer').hidden)closeFetch();else if(!$('pin-layer').hidden)closePin();else if(!$('cert-layer').hidden)closeCertificates()}if(e.key==='Tab'){const layer=!$('fetch-layer').hidden?$('fetch-layer'):!$('pin-layer').hidden?$('pin-layer'):!$('cert-layer').hidden?$('cert-layer'):null;if(!layer)return;const items=[...layer.querySelectorAll('button,input')].filter(x=>!x.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
if(new URLSearchParams(location.search).get('view')==='certificates')openCertificates();
if(new URLSearchParams(location.search).get('view')==='fetch')openFetch();
</script></body></html>
