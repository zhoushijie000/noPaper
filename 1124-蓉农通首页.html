<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>蓉农通 · 首页</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f3f4f5; color: #303333; font: 16px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif }
a { color: inherit; text-decoration: none }
button { color: inherit; font: inherit; cursor: pointer }
:focus-visible { outline: 2px solid #2ba751; outline-offset: 4px }
.app { width: min(100%,480px); margin: auto; min-height: 100dvh; padding-bottom: calc(85px + env(safe-area-inset-bottom)); overflow: hidden; background: #f3f4f5 }
h1,h2,p { margin: 0 }
.page-header { height: 54px; display: grid; place-items: center; background: white }
.page-header h1 { font-size: 19px; font-weight: 600; color: #111 }
.hero { position: relative; background: #b3ed9b; padding-bottom: 28px; border-radius: 0 0 5px 5px }
.hero img { display: block; width: 100%; height: auto }
.hero::after { position: absolute; bottom: 34px; left: calc(50% - 12px); width: 24px; height: 4px; background: white; border-radius: 4px; content: '' }
.panel { margin: 14px 4.6% 0; border-radius: 10px; background: white }
.services { position: relative; margin-top: -27px; padding: 0 18px 20px; border: 1px solid #fff; background: linear-gradient(180deg,#e7f8ed 0,white 47px) }
.section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 0 }
.section-header h2 { font-size: 20px; font-weight: 700 }
.more { display: flex; align-items: center; gap: 8px; color: #686e6a; font-size: 14px; white-space: nowrap }
.chevron { display: inline-block; width: 6px; height: 6px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg) }
.service-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 15px 8px; padding-top: 22px; border-top: 1px dashed #e5e8e5; align-items: start }
.service-item { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; text-align: center; font-size: 15px; line-height: 1.5 }
.service-item img,.service-icon { width: 36px; height: 36px; object-fit: contain; border-radius: 9px }
.service-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 100%; min-height: 45px; overflow-wrap: anywhere }
.service-icon { display: grid; place-items: center; background: linear-gradient(145deg,#e6f7eb,#cef0db); color: #37a763 }
.service-icon svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.sign-entry { border-radius: 8px; transition: background .15s, transform .15s }
.sign-entry:hover { background: #f1faf4 }
.sign-entry:active { transform: scale(.97) }
.prices { display: flex; align-items: center; gap: 18px; padding: 13px 14px; background: linear-gradient(130deg,#f5faed,white) }
.basket { width: 39px; height: 39px; flex: none; object-fit: contain }
.price-grid { display: grid; grid-template-columns: 1fr 1fr; flex: 1; gap: 12px }
.price-item { font-size: 16px }
.price-value { color: #42b250; white-space: nowrap }
.price-value span { color: #999; margin-left: 3px }
.prices .more { margin-left: auto }
.news { padding: 0 13px 18px }
.news .section-header { padding: 17px 10px }
.news-placeholder { display: grid; grid-template-columns: 1fr 1fr; gap: 11px }
.news-image { height: 90px; border-radius: 5px; background: linear-gradient(180deg,#edf9fd,#f4faf5) }
.bottom-nav { position: fixed; z-index: 2; bottom: 0; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3,1fr); width: min(100%,480px); padding: 7px 0 calc(9px + env(safe-area-inset-bottom)); border-top: 1px solid #e1e3e4; background: #fff }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #999; font-size: 15px }
.nav-item svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8 }
.nav-item.active { color: #333 }
.nav-item.active .accent { stroke: #4db45c }
@media (max-width:350px) {
.services { padding-inline: 13px }
.service-grid { column-gap: 5px }
.service-item { font-size: 13px }
.prices { gap: 10px; padding-inline: 12px }
.price-item { font-size: 14px }
.prices .more { font-size: 12px }
}
@media (prefers-reduced-motion:reduce) { .sign-entry { transition: none } }
</style>
</head>
